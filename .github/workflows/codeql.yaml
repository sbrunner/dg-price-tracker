---
name: Code scanning

on:
  push:
  schedule:
    - cron: '0 19 * * 0'

jobs:
  codeql:
    runs-on: ubuntu-24.04
    name: Code scanning
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
